name: Verify Catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ekilyhq'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EKILY_PACKAGES_READ_TOKEN || github.token }}

      - name: Run verifier tests
        run: node scripts/test-verify-catalog.mjs

      - name: Verify official catalog and theme artifacts
        run: node scripts/verify-catalog.mjs --catalog catalog.json --remote --verify-assets
